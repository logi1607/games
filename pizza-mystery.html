<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Web謎「ピザ屋」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --crust:#E8A33D;
    --tomato:#D64933;
    --cheese:#F6C453;
    --basil:#4C7A57;
    --wood:#4A3428;
    --cream:#FFF6E9;
    --char:#241712;
    --fire1:#FF6B35;
    --fire2:#FFD23F;
    --ink:#2B1B14;
    --paper:#FBF3E3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic', sans-serif;
    background: radial-gradient(circle at 30% 0%, #FFE9C7 0%, var(--cream) 55%, #F3E2C2 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 12px 60px;
  }
  .app{ width:100%; max-width:480px; }
  .stage{
    position:relative;
    background:#fff;
    border-radius:22px;
    box-shadow:0 18px 40px rgba(74,52,40,0.18), 0 2px 0 rgba(74,52,40,0.06);
    padding:18px 16px 20px;
    overflow:hidden;
    border:3px solid var(--wood);
  }
  .rules-btn{
    position:absolute; top:14px; right:14px; z-index:30;
    background:var(--wood); color:var(--paper); border:none;
    font-family:inherit; font-weight:700; font-size:13px;
    padding:8px 14px; border-radius:999px; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.2);
  }
  .rules-btn:active{ transform:translateY(2px); box-shadow:none; }

  .banner{
    background:var(--tomato); color:#fff; font-weight:900;
    font-size:14px; text-align:center; padding:10px 14px;
    border-radius:12px; margin:42px 0 12px; line-height:1.5;
    position:relative; cursor:default; user-select:none;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  .banner.selected{ outline:3px dashed var(--cheese); outline-offset:2px; }
  .banner .tag{
    position:absolute; right:8px; bottom:6px; font-size:10px;
    background:rgba(255,255,255,0.25); padding:2px 8px; border-radius:999px;
  }

  .order-info{ text-align:center; margin-top:6px; }
  .dots{ display:flex; justify-content:center; gap:8px; margin-bottom:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#E7DCC8; border:1.5px solid var(--wood); }
  .dot.active{ background:var(--tomato); border-color:var(--tomato); }
  .order-title{ margin:2px 0 4px; font-size:13px; color:#8a7358; font-weight:700; }
  .order-desc{ margin:0 0 6px; font-size:19px; font-weight:900; color:var(--ink); }
  .step-instruction{ margin:0; font-size:14px; font-weight:700; color:var(--tomato); }
  .hint{ margin:2px 0 0; font-size:11px; color:#a1907a; }

  .illustration-frame{
    position:relative; margin-top:12px; border-radius:16px; overflow:hidden;
    aspect-ratio:3/2; background:#cfe7ef; border:2px solid var(--wood);
  }
  .illustration-frame svg{ width:100%; height:100%; display:block; }
  .sprite-layer{ position:absolute; inset:0; pointer-events:none; }
  .zoom-controls{
    position:absolute; right:10px; bottom:10px; z-index:30;
    display:flex; flex-direction:column; gap:6px;
  }
  .zoom-controls button{
    width:34px; height:34px; border-radius:10px; border:none;
    background:rgba(43,27,20,0.82); color:#fff; font-size:19px; font-weight:700;
    cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  .zoom-controls button:disabled{ opacity:0.35; cursor:default; }
  .zoom-controls button:active:not(:disabled){ transform:translateY(1px); }

  .lasso-overlay{
    position:absolute; inset:18px 16px 20px; z-index:20;
    touch-action:none; cursor:crosshair;
  }
  .lasso-overlay svg{ width:100%; height:100%; overflow:visible; }
  .lasso-path{ fill:rgba(214,73,51,0.12); stroke:var(--tomato); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:2 10; }

  .toast{
    position:absolute; left:50%; bottom:14px; transform:translate(-50%,10px);
    background:var(--ink); color:#fff; padding:9px 18px; border-radius:999px;
    font-size:13px; font-weight:700; opacity:0; transition:all .25s ease; pointer-events:none;
    white-space:nowrap; z-index:40;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  .order-clear{
    position:absolute; inset:0; z-index:50; background:rgba(43,27,20,0.72);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
    opacity:0; transition:opacity .3s ease; pointer-events:none;
  }
  .order-clear.show{ opacity:1; }
  .order-clear-text{ color:#fff; }
  .order-clear-text .big{ font-size:26px; font-weight:900; display:block; margin-bottom:8px; }
  .order-clear-text .small{ font-size:14px; opacity:0.85; }

  .flame path{ transform-origin: bottom center; animation: flicker 1.1s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{ transform:scaleY(1) scaleX(1);} 50%{ transform:scaleY(1.08) scaleX(0.94);} }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(43,27,20,0.55); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal-backdrop[hidden]{ display:none; }
  .modal{
    background:var(--paper); border-radius:18px; padding:24px 22px; max-width:400px; width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:88vh; overflow-y:auto;
  }
  .modal h2{ margin:0 0 14px; font-size:22px; text-align:center; color:var(--tomato); }
  .rule{ display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
  .rule .icon{ flex:0 0 auto; }
  .rule .txt strong{ display:block; font-size:14px; margin-bottom:2px; }
  .rule .txt span{ font-size:12.5px; color:#6b5a45; line-height:1.5; }
  .modal .primary-btn{
    display:block; width:100%; margin-top:8px; padding:13px; border:none; border-radius:12px;
    background:var(--tomato); color:#fff; font-family:inherit; font-weight:900; font-size:15px;
    cursor:pointer; box-shadow:0 4px 0 #a83521;
  }
  .modal .primary-btn:active{ transform:translateY(3px); box-shadow:none; }
  .modal .secondary-btn{
    display:block; width:100%; margin-top:10px; padding:11px; border:2px solid var(--wood); border-radius:12px;
    background:transparent; color:var(--wood); font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer;
  }

  .final-modal{ text-align:center; }
  .clear-text{ font-size:30px; font-weight:900; color:var(--tomato); margin-bottom:14px; }
  .newspaper{
    background:#fff; border:2px solid var(--ink); border-radius:4px; padding:14px 16px; text-align:left;
    box-shadow:3px 3px 0 rgba(0,0,0,0.15); margin-bottom:14px;
  }
  .newspaper .masthead{ font-size:11px; letter-spacing:2px; color:#999; text-align:center; border-bottom:1px solid #ccc; padding-bottom:6px; margin-bottom:8px; }
  .newspaper .headline{ font-size:17px; font-weight:900; line-height:1.4; margin-bottom:8px; }
  .newspaper .fake-line{ height:7px; background:#e4dccb; border-radius:3px; margin-bottom:6px; }
  .final-modal p{ font-size:13.5px; color:#6b5a45; margin:0 0 14px; }

  @media (max-width:360px){
    .order-desc{ font-size:16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <button class="rules-btn" id="rulesBtn">ルール</button>

    <div class="banner" id="banner" hidden>
      ピザ屋が大火事、建物が全焼してしまった！
      <span class="tag">囲めるよ</span>
    </div>

    <div class="order-info">
      <div class="dots" id="dots"></div>
      <div class="order-title" id="orderTitle">1つ目の注文</div>
      <div class="order-desc" id="orderDesc"></div>
      <div class="step-instruction" id="stepInstruction"></div>
      <div class="hint">指やマウスで対象をぐるっと囲んでね</div>
    </div>

    <div class="illustration-frame" id="illustrationFrame">
      <svg id="sceneSvg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="sprite-layer" id="spriteLayer"></div>
      <div class="zoom-controls">
        <button id="zoomInBtn" aria-label="拡大">＋</button>
        <button id="zoomOutBtn" aria-label="縮小">－</button>
      </div>
    </div>

    <div class="lasso-overlay" id="lassoOverlay">
      <svg id="lassoSvg"></svg>
    </div>

    <div class="toast" id="toast"></div>
    <div class="order-clear" id="orderClear">
      <div class="order-clear-text" id="orderClearText"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="rulesBackdrop">
  <div class="modal">
    <h2>Web謎「ピザ屋」</h2>
    <div class="rule">
      <div class="icon">
        <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#D64933" stroke-width="3" stroke-dasharray="4 5"/><circle cx="20" cy="20" r="4" fill="#E8A33D"/></svg>
      </div>
      <div class="txt">
        <strong>①きじの材料を指定しよう</strong>
        <span>使用するきじを囲うことで選択できるよ</span>
      </div>
    </div>
    <div class="rule">
      <div class="icon">
        <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#4C7A57" stroke-width="3" stroke-dasharray="4 5"/><rect x="14" y="14" width="12" height="12" rx="2" fill="#4C7A57"/></svg>
      </div>
      <div class="txt">
        <strong>②きじを入れる場所を指定しよう</strong>
        <span>きじを入れる場所を囲うことで選択できるよ</span>
      </div>
    </div>
    <div class="rule">
      <div class="icon">
        <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#F6C453"/><path d="M12 20l6 6 10-12" fill="none" stroke="#4A3428" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt">
        <strong>③正しく指定できたらその注文はクリア</strong>
        <span>3つの注文すべてに対応しよう！</span>
      </div>
    </div>
    <button class="primary-btn" id="rulesActionBtn">ゲームスタート</button>
  </div>
</div>

<div class="modal-backdrop" id="finalBackdrop" hidden>
  <div class="modal final-modal">
    <div class="clear-text">クリア！</div>
    <div class="newspaper">
      <div class="masthead">デイリー・ピザタイムズ</div>
      <div class="headline">ピザ屋が大火事、建物が全焼してしまった！</div>
      <div class="fake-line" style="width:96%"></div>
      <div class="fake-line" style="width:88%"></div>
      <div class="fake-line" style="width:92%"></div>
      <div class="fake-line" style="width:60%"></div>
    </div>
    <p>この大火事はニュースになった。</p>
    <button class="primary-btn" id="postXBtn">Xにポスト</button>
    <button class="secondary-btn" id="replayBtn">もう一度遊ぶ</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const ZOOMS = ['exterior','interior','kitchen','backyard'];
  const state = { order:1, step:1, zoomIndex:1, burnt:false, articleSelected:false };

  // ---------- SVG helpers ----------
  function flame(cx, baseY, s, delay){
    s = s || 1; delay = delay || 0;
    const h = 46*s, w = 24*s;
    return `<g class="flame" style="animation-delay:${delay}s">
      <path d="M ${cx-w/2} ${baseY} Q ${cx-w*0.75} ${baseY-h*0.6} ${cx} ${baseY-h} Q ${cx+w*0.75} ${baseY-h*0.6} ${cx+w/2} ${baseY} Z" fill="#FF6B35"/>
      <path d="M ${cx-w*0.26} ${baseY} Q ${cx-w*0.4} ${baseY-h*0.42} ${cx} ${baseY-h*0.68} Q ${cx+w*0.4} ${baseY-h*0.42} ${cx+w*0.26} ${baseY} Z" fill="#FFD23F"/>
    </g>`;
  }
  function flameRow(xs, baseY, s){
    return xs.map((x,i)=>flame(x, baseY, s, i*0.15)).join('');
  }
  function smoke(cx, cy, s){
    s = s || 1;
    return `<g opacity="0.55">
      <ellipse cx="${cx}" cy="${cy}" rx="${20*s}" ry="${13*s}" fill="#8d867d"/>
      <ellipse cx="${cx+18*s}" cy="${cy-14*s}" rx="${15*s}" ry="10" fill="#8d867d"/>
      <ellipse cx="${cx-14*s}" cy="${cy-10*s}" rx="${13*s}" ry="${9*s}" fill="#a49c92"/>
    </g>`;
  }
  function sootStreaks(x,y,w,h,n){
    n = n||4; let out='';
    for(let i=0;i<n;i++){
      const sx = x + (w/(n+1))*(i+1) + (Math.random()*10-5);
      out += `<path d="M ${sx} ${y} q ${6-Math.random()*12} ${h*0.5} 0 ${h}" stroke="#2a1c14" stroke-width="${4+Math.random()*3}" fill="none" opacity="0.35" stroke-linecap="round"/>`;
    }
    return out;
  }

  function flourSack(x,y,w,h,idAttr){
    // trapezoid sack with tie-top
    const topW = w*0.5, topX = x + (w-topW)/2;
    return `<g class="target" data-id="${idAttr}">
      <path d="M ${x} ${y+h} Q ${x} ${y+h*0.35} ${topX} ${y+h*0.18} L ${topX} ${y+h*0.05} L ${topX+topW} ${y+h*0.05} L ${topX+topW} ${y+h*0.18} Q ${x+w} ${y+h*0.35} ${x+w} ${y+h} Z" fill="#EFE0C0" stroke="#C9AE7E" stroke-width="3"/>
      <ellipse cx="${x+w/2}" cy="${y+h*0.03}" rx="${topW*0.42}" ry="7" fill="#C9AE7E"/>
      <circle cx="${x+w*0.35}" cy="${y+h*0.55}" r="4" fill="#E9DAB6"/>
      <circle cx="${x+w*0.6}" cy="${y+h*0.68}" r="5" fill="#E9DAB6"/>
      <circle cx="${x+w*0.45}" cy="${y+h*0.78}" r="3.5" fill="#E9DAB6"/>
    </g>`;
  }

  function pizzaSign(x,y,w,h){
    return `<g>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#FBF3E3" stroke="#4A3428" stroke-width="3"/>
      <circle cx="${x+22}" cy="${y+h/2}" r="11" fill="#E8A33D" stroke="#B97A2B" stroke-width="2"/>
      <circle cx="${x+18}" cy="${y+h/2-3}" r="2" fill="#D64933"/>
      <circle cx="${x+26}" cy="${y+h/2+3}" r="2" fill="#D64933"/>
      <circle cx="${x+24}" cy="${y+h/2-5}" r="1.6" fill="#4C7A57"/>
      <text x="${x+44}" y="${y+h/2+7}" font-family="'Zen Maru Gothic',sans-serif" font-weight="900" font-size="20" fill="#D64933">PIZZA</text>
    </g>`;
  }

  // ---------- Scenes ----------
  function renderExterior(burnt){
    let s = `<rect x="0" y="0" width="600" height="300" fill="${burnt?'#5b5850':'#BFE3EF'}"/>
      <circle cx="70" cy="60" r="30" fill="${burnt?'#7a746a':'#FFE6A0'}"/>
      <rect x="0" y="300" width="600" height="100" fill="${burnt?'#7d7466':'#D9C9A3'}"/>
      <rect x="30" y="230" width="70" height="90" fill="${burnt?'#8f8878':'#cfc0e0'}" opacity="0.6"/>
      <rect x="500" y="210" width="80" height="110" fill="${burnt?'#8f8878':'#bcd8c9'}" opacity="0.6"/>`;

    if(!burnt){
      s += `<g class="target" data-id="building">
        <path d="M190,140 A110,90 0 0 1 410,140 Z" fill="#D64933"/>
        <path d="M190,140 A110,90 0 0 1 410,140" fill="none" stroke="#a83521" stroke-width="4"/>
        <rect x="190" y="140" width="220" height="160" fill="#F3E2C2"/>
        <rect x="190" y="140" width="220" height="14" fill="#e8cfa0"/>
        <circle cx="225" cy="200" r="20" fill="#BFE3EF" stroke="#4A3428" stroke-width="4"/>
        <line x1="225" y1="180" x2="225" y2="220" stroke="#4A3428" stroke-width="3"/>
        <line x1="205" y1="200" x2="245" y2="200" stroke="#4A3428" stroke-width="3"/>
        <circle cx="375" cy="200" r="20" fill="#BFE3EF" stroke="#4A3428" stroke-width="4"/>
        <line x1="375" y1="180" x2="375" y2="220" stroke="#4A3428" stroke-width="3"/>
        <line x1="355" y1="200" x2="395" y2="200" stroke="#4A3428" stroke-width="3"/>
        <path d="M270,300 L270,235 Q270,222 283,222 L317,222 Q330,222 330,235 L330,300 Z" fill="#3B2A20"/>
        ${pizzaSign(230,95,170,42)}
      </g>`;
    } else {
      s += `<g class="target" data-id="building">
        <path d="M190,140 A110,90 0 0 1 410,140 Z" fill="#3a2c22"/>
        <rect x="190" y="140" width="220" height="160" fill="#4b3a2e"/>
        ${sootStreaks(190,140,220,160,6)}
        <circle cx="225" cy="200" r="20" fill="#8a3220" stroke="#241712" stroke-width="4"/>
        <circle cx="375" cy="200" r="20" fill="#8a3220" stroke="#241712" stroke-width="4"/>
        <path d="M270,300 L270,235 Q270,222 283,222 L317,222 Q330,222 330,235 L330,300 Z" fill="#B33A1E"/>
        ${flameRow([230,270,300,330,370],140,1.1)}
        ${flameRow([250,300,350],230,0.6)}
        ${smoke(240,60,1.3)}${smoke(340,50,1)}
        ${pizzaSign(230,95,170,42)}
      </g>`;
    }
    return s;
  }

  function renderInterior(burnt, showNewspaper){
    let s = `<rect x="0" y="0" width="600" height="260" fill="${burnt?'#4b3a2e':'#E9D9B8'}"/>
      <rect x="0" y="260" width="600" height="140" fill="${burnt?'#3a2c22':'#B98A5A'}"/>`;
    if(burnt) s += sootStreaks(0,0,600,120,10);

    // reception counter
    s += `<rect x="380" y="150" width="180" height="110" fill="${burnt?'#2f231b':'#7a5236'}"/>
      <rect x="400" y="160" width="80" height="50" fill="${burnt?'#8a3220':'#F3E3B0'}"/>`;

    // tables
    const tableFill = burnt ? '#241712' : '#8a5a34';
    s += `<g><ellipse cx="110" cy="330" rx="46" ry="14" fill="${tableFill}"/><rect x="95" y="285" width="30" height="45" fill="${tableFill}"/>
      <rect x="40" y="345" width="18" height="26" fill="${tableFill}"/><rect x="150" y="345" width="18" height="26" fill="${tableFill}"/></g>`;
    s += `<g><ellipse cx="250" cy="345" rx="46" ry="14" fill="${tableFill}"/><rect x="235" y="300" width="30" height="45" fill="${tableFill}"/>
      <rect x="182" y="358" width="18" height="26" fill="${tableFill}"/><rect x="292" y="358" width="18" height="26" fill="${tableFill}"/></g>`;

    if(burnt){
      s += flameRow([60,300,440,520],130,0.9);
      s += smoke(200,40,1.2)+smoke(420,30,1);
      // giant pizza remnant on the floor
      s += `<ellipse cx="330" cy="340" rx="95" ry="34" fill="#e8a33d"/>
        <ellipse cx="330" cy="332" rx="95" ry="30" fill="#f2b954"/>
        <circle cx="290" cy="322" r="8" fill="#c1442e"/><circle cx="340" cy="315" r="8" fill="#c1442e"/>
        <circle cx="370" cy="335" r="8" fill="#c1442e"/><circle cx="300" cy="345" r="7" fill="#4C7A57"/>
        <circle cx="360" cy="350" r="7" fill="#4C7A57"/>`;
    }

    if(showNewspaper){
      s += `<g class="target" data-id="newspaper">
        <rect x="70" y="296" width="66" height="30" rx="2" fill="#FBF3E3" stroke="#6b5a45" stroke-width="1.5" transform="rotate(-6 103 311)"/>
        <g transform="rotate(-6 103 311)">
          <rect x="76" y="302" width="54" height="4" fill="#2B1B14"/>
          <rect x="76" y="309" width="42" height="2.5" fill="#a99c86"/>
          <rect x="76" y="314" width="46" height="2.5" fill="#a99c86"/>
          <rect x="76" y="319" width="34" height="2.5" fill="#a99c86"/>
        </g>
      </g>`;
    }
    return s;
  }

  function renderKitchen(burnt){
    let s = `<rect x="0" y="0" width="600" height="280" fill="${burnt?'#4b453c':'#DCD3C2'}"/>
      <rect x="0" y="280" width="600" height="120" fill="${burnt?'#5c554a':'#EDEDE3'}"/>`;
    for(let i=0;i<8;i++) s += `<line x1="${i*75}" y1="280" x2="${i*75}" y2="400" stroke="${burnt?'#4a463f':'#d8d4c9'}" stroke-width="2"/>`;
    if(burnt) s += sootStreaks(0,0,600,130,8);

    // counter
    s += `<rect x="350" y="190" width="230" height="90" fill="${burnt?'#3a3a3a':'#C9CDD1'}"/>
      <rect x="365" y="170" width="10" height="26" fill="${burnt?'#241712':'#4A3428'}"/>
      <rect x="345" y="164" width="50" height="10" rx="4" fill="${burnt?'#241712':'#4A3428'}"/>`;

    // oven
    if(!burnt){
      s += `<g class="target" data-id="oven">
        <path d="M60,280 A100,80 0 0 1 260,280 Z" fill="#8B4A2B"/>
        <rect x="60" y="280" width="200" height="10" fill="#6f3a20"/>
        <path d="M110,280 L110,205 Q110,180 135,180 L185,180 Q210,180 210,205 L210,280 Z" fill="#241712"/>
        <path d="M125,280 L125,215 Q125,198 140,198 L180,198 Q195,198 195,215 L195,280 Z" fill="#E8A33D" opacity="0.85"/>
        <path d="M140,280 L140,230 Q140,220 150,220 L170,220 Q180,220 180,230 L180,280 Z" fill="#FFD23F" opacity="0.9"/>
      </g>`;
    } else {
      s += `<g class="target" data-id="oven">
        <path d="M60,280 A100,80 0 0 1 260,280 Z" fill="#2c1c14"/>
        <path d="M110,280 L110,205 Q110,180 135,180 L185,180 Q210,180 210,205 L210,280 Z" fill="#1a1210"/>
        <path d="M125,280 L125,215 Q125,198 140,198 L180,198 Q195,198 195,215 L195,280 Z" fill="#FF6B35"/>
        <path d="M140,280 L140,230 Q140,220 150,220 L170,220 Q180,220 180,230 L180,280 Z" fill="#FFD23F"/>
        ${flameRow([90,160,230],200,1)}
        ${smoke(160,70,1.3)}
      </g>`;
    }

    // small flour bag
    s += flourSack(410,140,70,90,'flour_small').replace('EFE0C0', burnt? 'd8c9a4':'EFE0C0');
    if(burnt) s += smoke(60,60,1);
    return s;
  }

  function renderBackyard(burnt){
    let s = `<rect x="0" y="0" width="600" height="280" fill="${burnt?'#4a4238':'#A98F6B'}"/>
      <rect x="0" y="280" width="600" height="120" fill="${burnt?'#6b6355':'#CFCABF'}"/>`;
    for(let i=0;i<9;i++) s += `<line x1="${i*70}" y1="0" x2="${i*70}" y2="280" stroke="${burnt?'#3d372f':'#8f7757'}" stroke-width="3"/>`;
    if(burnt) s += sootStreaks(0,0,600,120,8);

    function crate(x,y,w,h,items){
      let g = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${burnt?'#2e241a':'#9a6b3f'}" stroke="${burnt?'#1a1310':'#6b4623'}" stroke-width="3"/>`;
      items.forEach(it=>{ g += `<circle cx="${it[0]}" cy="${it[1]}" r="${it[2]}" fill="${burnt?'#2b2620':it[3]}"/>`; });
      return g;
    }
    s += crate(60,210,110,70,[[85,205,14,'#C1442E'],[110,198,13,'#C1442E'],[140,206,12,'#C9A25A']]);
    s += crate(190,225,90,55,[[210,220,10,'#4C7A57'],[235,216,9,'#4C7A57'],[255,222,9,'#4C7A57']]);

    if(burnt){
      s += flameRow([90,220,480,540],120,0.9);
      s += smoke(150,50,1.1)+smoke(500,40,1);
    }

    // big flour bag - noticeably larger
    s += flourSack(350,105,170,175,'flour_big').replace('EFE0C0', burnt? 'd8c9a4':'EFE0C0');
    return s;
  }

  function sceneMarkup(){
    const zone = ZOOMS[state.zoomIndex];
    if(zone==='exterior') return renderExterior(state.burnt);
    if(zone==='interior') return renderInterior(state.burnt, state.order>=3);
    if(zone==='kitchen') return renderKitchen(state.burnt);
    if(zone==='backyard') return renderBackyard(state.burnt);
  }

  const sceneSvg = document.getElementById('sceneSvg');
  function redrawScene(){ sceneSvg.innerHTML = sceneMarkup(); }

  // ---------- UI text ----------
  const ORDER_DESC = {
    1:'Mサイズのピザを焼こう',
    2:'XXXXLサイズのピザ（直径20m）を焼こう',
    3:'ニュースにしよう'
  };
  const STEP_TEXT = { 1:'①きじを指定しよう', 2:'②きじを入れる場所を指定しよう' };

  const dotsEl = document.getElementById('dots');
  const orderTitleEl = document.getElementById('orderTitle');
  const orderDescEl = document.getElementById('orderDesc');
  const stepInstructionEl = document.getElementById('stepInstruction');
  const bannerEl = document.getElementById('banner');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const toastEl = document.getElementById('toast');
  const orderClearEl = document.getElementById('orderClear');
  const orderClearTextEl = document.getElementById('orderClearText');
  const spriteLayer = document.getElementById('spriteLayer');

  function updateUI(){
    dotsEl.innerHTML = [1,2,3].map(n=>`<div class="dot${n===state.order?' active':''}"></div>`).join('');
    orderTitleEl.textContent = state.order+'つ目の注文';
    orderDescEl.textContent = ORDER_DESC[state.order];
    stepInstructionEl.textContent = STEP_TEXT[state.step];
    bannerEl.hidden = !state.burnt;
    if(state.burnt) bannerEl.classList.toggle('selected', state.articleSelected);
    zoomInBtn.disabled = state.zoomIndex >= ZOOMS.length-1;
    zoomOutBtn.disabled = state.zoomIndex <= 0;
  }

  let toastTimer=null;
  function showToast(msg){
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1600);
  }

  function showOrderClear(n, cb){
    orderClearTextEl.innerHTML = `<span class="big">${n}つ目の注文クリア！</span><span class="small">${n+1}つ目の注文に進みます</span>`;
    orderClearEl.classList.add('show');
    setTimeout(()=>{
      orderClearEl.classList.remove('show');
      cb();
    }, 1500);
  }

  function spawnSprite(html, style){
    const d = document.createElement('div');
    d.innerHTML = html;
    d.style.position='absolute';
    Object.assign(d.style, style);
    spriteLayer.appendChild(d);
    return d;
  }
  function clearSprites(){ spriteLayer.innerHTML=''; }

  // ---------- animations ----------
  function playBakeAnimation(done){
    clearSprites();
    const dough = spawnSprite(
      `<svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="#F1DFB0" stroke="#C9AE7E" stroke-width="3"/></svg>`,
      { left:'46%', top:'34%', transition:'all .7s ease', opacity:'1' }
    );
    requestAnimationFrame(()=>{
      dough.style.left='27%'; dough.style.top='58%'; dough.style.transform='scale(0.55)'; dough.style.opacity='0.9';
    });
    setTimeout(()=>{
      dough.remove();
      const pizza = spawnSprite(
        `<svg width="60" height="60" viewBox="0 0 60 60">
          <circle cx="30" cy="30" r="26" fill="#F2B954"/>
          <circle cx="20" cy="20" r="4.5" fill="#C1442E"/><circle cx="36" cy="18" r="4.5" fill="#C1442E"/>
          <circle cx="30" cy="34" r="4.5" fill="#C1442E"/><circle cx="18" cy="36" r="4" fill="#4C7A57"/>
          <circle cx="40" cy="34" r="4" fill="#4C7A57"/>
        </svg>`,
        { left:'23%', top:'46%', opacity:'0', transition:'opacity .5s ease, transform .5s ease', transform:'scale(0.6)' }
      );
      requestAnimationFrame(()=>{ pizza.style.opacity='1'; pizza.style.transform='scale(1)'; });
      setTimeout(()=>{ clearSprites(); done(); }, 900);
    }, 750);
  }

  function playBurnAnimation(done){
    clearSprites();
    const giant = spawnSprite(
      `<svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="66" fill="#F2B954" stroke="#C9AE7E" stroke-width="4"/>
      </svg>`,
      { left:'32%', top:'30%', opacity:'0', transition:'opacity .6s ease, transform .6s ease', transform:'scale(0.5)' }
    );
    requestAnimationFrame(()=>{ giant.style.opacity='1'; giant.style.transform='scale(1)'; });
    setTimeout(()=>{
      const fire = spawnSprite(
        `<svg width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="#FF6B35" opacity="0.55"/></svg>`,
        { left:'20%', top:'8%', opacity:'0', transition:'opacity .5s ease' }
      );
      requestAnimationFrame(()=>{ fire.style.opacity='1'; });
      state.burnt = true;
      redrawScene();
      updateUI();
      setTimeout(()=>{ clearSprites(); done(); }, 900);
    }, 700);
  }

  // ---------- game flow ----------
  function completeOrder(n){
    if(n<3){
      showOrderClear(n, ()=>{
        state.order = n+1;
        state.step = 1;
        redrawScene();
        updateUI();
      });
    } else {
      document.getElementById('finalBackdrop').hidden = false;
    }
  }

  function handleSelection(id){
    if(state.order===1){
      if(state.step===1){
        if(id==='flour_small'){ showToast('せいかい！'); state.step=2; updateUI(); }
        else if(id==='flour_big') showToast('これだと多すぎるみたい…');
        else showToast('これでは、ないみたい…');
      } else {
        if(id==='oven'){ playBakeAnimation(()=>completeOrder(1)); }
        else showToast('これでは、ないみたい…');
      }
    } else if(state.order===2){
      if(state.step===1){
        if(id==='flour_big'){ showToast('せいかい！'); state.step=2; updateUI(); }
        else if(id==='flour_small') showToast('これだと少なすぎるみたい…');
        else showToast('これでは、ないみたい…');
      } else {
        if(id==='building'){ playBurnAnimation(()=>completeOrder(2)); }
        else if(id==='oven') showToast('これだと小さすぎるみたい…');
        else showToast('これでは、ないみたい…');
      }
    } else if(state.order===3){
      if(state.step===1){
        if(id==='headline'){ showToast('せいかい！'); state.articleSelected=true; state.step=2; updateUI(); }
        else showToast('これでは、ないみたい…');
      } else {
        if(id==='newspaper'){ completeOrder(3); }
        else showToast('これでは、ないみたい…');
      }
    }
  }

  // ---------- zoom controls ----------
  zoomInBtn.addEventListener('click', ()=>{
    if(state.zoomIndex < ZOOMS.length-1){ state.zoomIndex++; redrawScene(); updateUI(); }
  });
  zoomOutBtn.addEventListener('click', ()=>{
    if(state.zoomIndex > 0){ state.zoomIndex--; redrawScene(); updateUI(); }
  });

  // ---------- lasso drawing / hit testing ----------
  const lassoOverlay = document.getElementById('lassoOverlay');
  const lassoSvg = document.getElementById('lassoSvg');
  let drawing=false, points=[], pathEl=null;

  function overlayLocal(clientX, clientY){
    const r = lassoOverlay.getBoundingClientRect();
    return { x: clientX-r.left, y: clientY-r.top };
  }
  function pointsToPath(pts){
    if(pts.length<2) return '';
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++) d += ` L ${pts[i].x} ${pts[i].y}`;
    return d+' Z';
  }

  function startDraw(clientX, clientY){
    drawing=true; points=[overlayLocal(clientX,clientY)];
    pathEl = document.createElementNS('http://www.w3.org/2000/svg','path');
    pathEl.setAttribute('class','lasso-path');
    lassoSvg.appendChild(pathEl);
  }
  function moveDraw(clientX, clientY){
    if(!drawing) return;
    points.push(overlayLocal(clientX,clientY));
    pathEl.setAttribute('d', pointsToPath(points));
  }
  function endDraw(){
    if(!drawing) return;
    drawing=false;
    if(pathEl){ pathEl.remove(); pathEl=null; }
    evaluateLasso(points);
    points=[];
  }

  function evaluateLasso(pts){
    if(pts.length<4) return; // too small a gesture, ignore
    const overlayRect = lassoOverlay.getBoundingClientRect();
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    pts.forEach(p=>{
      const cx=p.x+overlayRect.left, cy=p.y+overlayRect.top;
      if(cx<minX)minX=cx; if(cx>maxX)maxX=cx; if(cy<minY)minY=cy; if(cy>maxY)maxY=cy;
    });
    const drawW=maxX-minX, drawH=maxY-minY;
    if(drawW<12 && drawH<12) return;
    const drawArea = Math.max(drawW,1)*Math.max(drawH,1);

    const targets = document.querySelectorAll('.target, .banner-target');
    let best=null, bestScore=-1;
    targets.forEach(el=>{
      const r = el.getBoundingClientRect();
      if(r.width<1||r.height<1) return;
      const ix1=Math.max(minX,r.left), iy1=Math.max(minY,r.top);
      const ix2=Math.min(maxX,r.right), iy2=Math.min(maxY,r.bottom);
      const iw=Math.max(0,ix2-ix1), ih=Math.max(0,iy2-iy1);
      const interArea = iw*ih;
      const targetArea = r.width*r.height;
      if(targetArea<=0) return;
      const overlapRatio = interArea/targetArea;
      const sizeRatio = drawArea/targetArea;
      if(overlapRatio>=0.45 && sizeRatio<=9){
        if(overlapRatio>bestScore){ bestScore=overlapRatio; best=el.dataset.id; }
      }
    });
    handleSelection(best);
  }

  lassoOverlay.addEventListener('pointerdown', e=>{ lassoOverlay.setPointerCapture(e.pointerId); startDraw(e.clientX,e.clientY); });
  lassoOverlay.addEventListener('pointermove', e=>{ if(drawing) moveDraw(e.clientX,e.clientY); });
  lassoOverlay.addEventListener('pointerup', endDraw);
  lassoOverlay.addEventListener('pointercancel', endDraw);

  // banner is also a target region (persistent, outside overlay's own box) -> give it .banner-target
  bannerEl.classList.add('banner-target');
  bannerEl.dataset.id='headline';
  bannerEl.addEventListener('pointerdown', e=>{ e.stopPropagation(); startDraw(e.clientX,e.clientY); lassoOverlay.setPointerCapture(e.pointerId); });

  // ---------- rules modal ----------
  const rulesBackdrop = document.getElementById('rulesBackdrop');
  const rulesActionBtn = document.getElementById('rulesActionBtn');
  const rulesBtn = document.getElementById('rulesBtn');
  let started=false;

  rulesActionBtn.addEventListener('click', ()=>{
    rulesBackdrop.hidden=true;
    if(!started){ started=true; redrawScene(); updateUI(); }
  });
  rulesBtn.addEventListener('click', ()=>{
    rulesActionBtn.textContent = started ? '閉じる' : 'ゲームスタート';
    rulesBackdrop.hidden=false;
  });

  // ---------- final modal ----------
  document.getElementById('postXBtn').addEventListener('click', ()=>{
    const text = encodeURIComponent('謎解き「ピザ屋」をクリアした！🍕🔥\nピザ屋が大火事、建物が全焼してしまった…\n#謎解きピザ屋');
    window.open('https://twitter.com/intent/tweet?text='+text, '_blank');
  });
  document.getElementById('replayBtn').addEventListener('click', ()=>{
    state.order=1; state.step=1; state.zoomIndex=1; state.burnt=false; state.articleSelected=false;
    document.getElementById('finalBackdrop').hidden=true;
    redrawScene(); updateUI();
  });

  // initial paint (behind rules modal)
  redrawScene();
  updateUI();
})();
</script>
</body>
</html>
